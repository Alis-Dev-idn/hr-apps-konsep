<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Upajiwa Enterprise Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#E8F4EC] text-[#334D40] min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    
    <!-- Brand Header sesuai assets/Dashboard.png & assets/icon.png -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-3xl bg-white shadow-md border border-[#D5E7DC] mb-3 p-2.5">
        <img src="assets/icon.png" alt="Upajiwa Icon" class="w-full h-full object-contain">
      </div>
      <h1 class="font-heading font-black text-2xl sm:text-3xl text-[#13231B] tracking-tight">Upajiwa</h1>
      <p class="text-xs sm:text-sm text-[#567364] mt-0.5 font-medium">Enterprise HRIS &amp; Payroll Workspace</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white border border-[#D5E7DC] rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
      <div>
        <h2 class="font-heading font-black text-xl text-[#13231B]">Masuk ke Ruang Kerja</h2>
        <p class="text-xs text-[#567364] mt-1">Pilih profil demonstrasi atau gunakan kredensial perusahaan Anda:</p>
      </div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-[#13231B] mb-1.5">Email Perusahaan</label>
          <input type="email" id="login-email" value="sarah.jenkins@pt-maju.co.id" class="w-full px-3.5 py-2.5 bg-[#F4F9F5] border border-[#D5E7DC] rounded-xl text-xs sm:text-sm text-[#13231B] focus:outline-none focus:border-[#0D6840]" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-[#13231B] mb-1.5">Kata Sandi</label>
          <input type="password" id="login-password" value="••••••••••••" class="w-full px-3.5 py-2.5 bg-[#F4F9F5] border border-[#D5E7DC] rounded-xl text-xs sm:text-sm text-[#13231B] focus:outline-none focus:border-[#0D6840]" required>
        </div>

        <div class="flex items-center justify-between text-xs text-[#567364] pt-1">
          <label class="flex items-center gap-2 cursor-pointer font-medium">
            <input type="checkbox" checked class="rounded accent-[#0D6840] border-[#D5E7DC]">
            <span>Ingat saya 30 hari</span>
          </label>
          <a href="#" class="text-[#0D6840] font-bold hover:underline">Lupa sandi?</a>
        </div>

        <button type="submit" class="w-full py-3 px-4 bg-[#0D6840] hover:bg-[#094F30] text-white font-black text-sm rounded-2xl transition-all shadow-md shadow-[#0D6840]/25 flex items-center justify-center gap-2 mt-4">
          <span>Masuk ke Dashboard</span>
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </form>

      <!-- Quick Role Switcher for Demo -->
      <div class="pt-5 border-t border-[#E8F4EC]">
        <p class="text-xs text-[#567364] font-bold mb-3 text-center uppercase tracking-wider text-[10px]">Pintas Demo Masuk Cepat:</p>
        <div class="grid grid-cols-2 gap-3">
          <button onclick="loginAsRole('admin')" class="p-3 bg-[#F4F9F5] hover:bg-[#E8F4EC] border border-[#D5E7DC] hover:border-[#0D6840] rounded-2xl text-left transition-all group">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#0D6840]"></span>
              <span class="text-xs font-bold text-[#13231B] group-hover:text-[#0D6840]">Sarah Jenkins</span>
            </div>
            <p class="text-[10px] text-[#567364] mt-1">HR Administrator (Akses penuh seluruh modul)</p>
          </button>
          <button onclick="loginAsRole('employee')" class="p-3 bg-[#F4F9F5] hover:bg-amber-50 border border-[#D5E7DC] hover:border-[#D97706] rounded-2xl text-left transition-all group">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#D97706]"></span>
              <span class="text-xs font-bold text-[#13231B] group-hover:text-[#D97706]">Budi Santoso</span>
            </div>
            <p class="text-[10px] text-[#567364] mt-1">Karyawan Mandiri (ESS & Riwayat Presensi)</p>
          </button>
        </div>
      </div>
    </div>

    <!-- Footer Copyright -->
    <div class="text-center mt-6 text-xs text-[#567364]">
      &copy; 2026 Upajiwa Enterprise HRIS &amp; Payroll SaaS. All Rights Reserved.
    </div>
  </div>

  <script src="mock-data.js"></script>
  <script src="layout.js"></script>
  <script>
    function loginAsRole(role) {
      setActiveRole(role);
      window.location.href = 'dashboard.html';
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      if (email.includes('budi') || email.includes('karyawan')) {
        loginAsRole('employee');
      } else {
        loginAsRole('admin');
      }
    }
  </script>
</body>
</html>
